name: Verify DataDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: python -m unittest discover -s analysis -v
      - run: pnpm qa:xlsx
      - run: node scripts/qa-formats.mjs
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: datadesk-xlsx-preview
          path: docs/preview-xlsx.png
          retention-days: 7
